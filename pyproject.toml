[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickyx-ai-detector"
version = "0.1.0"
description = "Moteur de forensic numérique local : probabilité qu'une image soit générée par IA (FFT + bruit résiduel + CNN ONNX)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Équipe ClickyX — IA Forensics" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.0",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
training = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9.12",
  "onnx>=1.15",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "pyarrow>=14",
  "huggingface_hub>=0.20",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ai-detector = "ai_detector.cli:main"

[tool.setuptools.packages.find]
include = ["ai_detector*", "training*"]

[tool.setuptools.package-data]
ai_detector = ["contracts/*.json", "contracts/*.d.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
